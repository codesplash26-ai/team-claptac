# ATLAS with Docker Compose.
#
#   docker compose up --build            then open http://localhost:8000
#   docker compose --profile sensors up  also starts an MQTT broker for Raspberry Pi sensor nodes
#   docker compose down -v               stop and delete all saved state (a clean start)
#
# No settings are required: without an AI key ATLAS uses its offline mode, and without access codes
# the console runs in open demo mode. To set any, copy .env.example to .env; compose reads it if present.

services:
  atlas:
    build: .
    image: atlas-claptac:latest
    ports:
      - "${ATLAS_PORT:-8000}:8000"
    # Settings come from .env if you create one (see .env.example); every one has a working default,
    # so nothing is required. Plain ${VAR:-default} substitution works on every Compose v2.
    environment:
      DATABASE_URL: sqlite:////app/state/atlas.db
      ATLAS_LLM_SETTINGS_PATH: /app/state/llm-settings.json
      ATLAS_SITE: ${ATLAS_SITE:-ratnapura}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_REQUESTS_PER_MINUTE: ${LLM_REQUESTS_PER_MINUTE:-30}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      INTELLIGENCE_MAX_CALLS_PER_INCIDENT: ${INTELLIGENCE_MAX_CALLS_PER_INCIDENT:-4}
      ATLAS_TOKENS: ${ATLAS_TOKENS:-}
      ATLAS_AUTH: ${ATLAS_AUTH:-}
      ATLAS_OPERATOR_TOKEN: ${ATLAS_OPERATOR_TOKEN:-}
      ATLAS_OTLP_ENDPOINT: ${ATLAS_OTLP_ENDPOINT:-}
      ATLAS_OTLP_HEADERS: ${ATLAS_OTLP_HEADERS:-}
      MQTT_ENABLED: ${MQTT_ENABLED:-false}
      MQTT_HOST: mqtt
    volumes:
      - atlas-state:/app/state        # the database, the ledger and saved AI settings
      - atlas-outputs:/app/outputs    # benchmark reports
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2
    profiles: ["sensors"]
    ports:
      - "1883:1883"
    volumes:
      - ./hardware/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

volumes:
  atlas-state:
  atlas-outputs:
