name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check atlas tests
      - run: python -m pytest -q

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start with Docker Compose, as the evaluators will
        run: |
          docker compose up -d --build
          for i in $(seq 1 40); do curl -fs http://localhost:8000/health && break; sleep 3; done
          curl -fs http://localhost:8000/health
          curl -fs -o /dev/null http://localhost:8000/manager/
      - if: always()
        run: docker compose logs atlas | tail -50; docker compose down -v
